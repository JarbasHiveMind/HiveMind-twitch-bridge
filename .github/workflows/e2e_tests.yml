name: HiveMind E2E

# Boots a REAL hivemind-core hub in-process (hivescope loopback WebSocket) and
# drives the Twitch bridge end to end against it. The Twitch IRC side is mocked
# explicitly in the test (no importorskip). The live-Twitch scaffold
# (tests/e2e/test_twitch_live.py) skips here because no Twitch creds are set.

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  hivemind_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq python3-dev libssl-dev

      # ovos-bus-client 2.x is still prerelease; --pre lets pip accept the
      # alpha hivemind-core stack that hivescope pulls (2.x migration).
      - name: Install bridge + e2e harness (hivescope from loopback branch)
        run: |
          python -m pip install --upgrade pip
          pip install --pre -e ".[e2e]"

      - name: Run HiveMind e2e
        run: |
          pytest tests/e2e/ -v -p no:cacheprovider \
            -W ignore::pytest.PytestUnraisableExceptionWarning
