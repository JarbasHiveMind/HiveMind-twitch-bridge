name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      # ovos-bus-client 2.x is still prerelease; pin it so pip accepts the alpha
      pre_install_pip: '"ovos-bus-client>=2.0.0a3"'
      install_extras: 'test'
      test_path: 'tests/'
