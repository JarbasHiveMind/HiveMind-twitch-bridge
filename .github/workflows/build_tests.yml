name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      install_extras: 'test'
      # Every test under tests/ EXCEPT tests/e2e, which is the directory and not
      # one named file: a file value collects that file alone, so a test file
      # added later reaches pytest in no workflow while the build_tests check
      # still reads green. tests/e2e stays out because it boots a real
      # hivemind-core hub through hivescope; e2e_tests.yml owns it, which is why
      # the heavy stack installs there and not in every matrix cell.
      test_path: 'tests/ --ignore=tests/e2e'
