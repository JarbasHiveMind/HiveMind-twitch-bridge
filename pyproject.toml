[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HiveMind-twitch-bridge"
description = "Relay a Twitch channel's chat to and from a HiveMind hub"
readme = "readme.md"
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
test = ["pytest"]
# e2e drives the bridge against a REAL hivemind-core hub booted in-process by
# hivescope (loopback WebSocket). hivescope is pinned to the loopback
# whitelist-only branch until that fix is released; install with --pre because
# the hivemind-core stack it pulls is still prerelease (2.x migration).
e2e = [
    "pytest",
    "hivescope @ git+https://github.com/JarbasHiveMind/hivescope.git@fix/loopback-whitelist-only-connection",
]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/HiveMind-twitch-bridge"

[project.scripts]
hivemind-twitch-bridge = "twitch_bridge.__main__:main"

[tool.setuptools]
packages = ["twitch_bridge"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "twitch_bridge.version.__version__" }
dependencies = { file = ["requirements.txt"] }
